# Bootstrap HTTP configuration; certbot --nginx --redirect adds TLS.
# Replace __DDNS_HOST__ in the installed copy, not in the repository.
server {
    listen 80;
    server_name __DDNS_HOST__;
    server_tokens off;
    client_max_body_size 1m;

    location ^~ /ui/ {
        # No trailing slash: preserve /ui/... for D.
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # x-bff-token comes from the frontend Worker; never insert it here.
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache off;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Keep docs, OpenAPI and internal APIs private.
    location / {
        return 404;
    }
}
